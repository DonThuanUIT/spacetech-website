services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spacetech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: spacetech
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacetech -d spacetech"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spacetech:${POSTGRES_PASSWORD}@db:5432/spacetech?schema=public
      UPLOAD_DIR: /app/data/uploads
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:deploy && npm run start:postgres"]
    restart: unless-stopped
volumes:
  postgres-data:
  uploads:
